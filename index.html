<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driving Instructions Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c8a84b;
    --dark: #1a1a1a;
    --panel-bg: #f7f5f2;
    --editor-bg: #1e1e2e;
    --editor-text: #cdd6f4;
    --accent: #a6e3a1;
    --border: #e0dbd3;
    --label: #7a6f63;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #13121a;
    color: var(--editor-text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar ── */
  .topbar {
    background: #1e1e2e;
    border-bottom: 1px solid #2a2a3e;
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .topbar-title {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .btn-print {
    background: var(--gold);
    color: #13121a;
    border: none;
    padding: 8px 20px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: opacity 0.15s;
  }
  .btn-print:hover { opacity: 0.85; }

  /* ── Main split ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Editor panel ── */
  .editor-panel {
    width: 340px;
    flex-shrink: 0;
    background: #1e1e2e;
    border-right: 1px solid #2a2a3e;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 24px 20px;
    gap: 20px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .field-group {
    background: #13121a;
    border: 1px solid #2a2a3e;
    border-radius: 10px;
    padding: 16px;
  }

  .field-row {
    margin-bottom: 14px;
  }
  .field-row:last-child { margin-bottom: 0; }

  .field-label {
    display: block;
    font-size: 11px;
    color: #8888aa;
    font-weight: 400;
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }

  .field-input, .field-textarea {
    width: 100%;
    background: #1e1e2e;
    border: 1px solid #2a2a3e;
    border-radius: 6px;
    color: var(--editor-text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    transition: border-color 0.15s;
    resize: none;
  }
  .field-input:focus, .field-textarea:focus {
    border-color: var(--gold);
  }
  .field-textarea { min-height: 80px; line-height: 1.5; }

  .add-section-btn {
    width: 100%;
    background: transparent;
    border: 1px dashed #2a2a3e;
    border-radius: 8px;
    color: #8888aa;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 10px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .add-section-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .remove-btn {
    float: right;
    background: none;
    border: none;
    color: #555577;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 0 0 0 8px;
    transition: color 0.15s;
  }
  .remove-btn:hover { color: #f38ba8; }

  /* ── Preview panel ── */
  .preview-panel {
    flex: 1;
    background: #13121a;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: 40px 30px;
  }

  /* ── The card itself ── */
  .card {
    background: #ffffff;
    width: 148mm;
    min-height: 210mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10mm 15mm 22mm 15mm;
    box-shadow: 0 8px 48px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }

  .card-hearts {
    width: 100%;
    display: block;
  }

  .card-directions {
    width: 100%;
    text-align: center;
    margin-top: 6mm;
  }

  .card-section-heading {
    display: block;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 11pt;
    font-weight: 500;
    font-variant: small-caps;
    letter-spacing: 0.07em;
    color: #1a1a1a;
    margin-top: 5.5mm;
    margin-bottom: 1.5mm;
  }
  .card-section-heading:first-child { margin-top: 0; }

  .card-direction-text {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 10.5pt;
    font-weight: 400;
    font-variant: small-caps;
    letter-spacing: 0.045em;
    color: #1a1a1a;
    line-height: 1.75;
  }

  /* ── Print styles ── */
  @media print {
    body { background: white !important; }
    .topbar, .editor-panel { display: none !important; }
    .preview-panel {
      padding: 0 !important;
      background: white !important;
      display: block !important;
    }
    .card {
      box-shadow: none !important;
      width: 100% !important;
      margin: 0 !important;
    }
  }
</style>
</head>

  </div>

</div>

<script>
  // Default content
  const defaultSections = [
    {
      heading: "From the North:",
      text: "From Manchester take the M6 South towards London. Merge onto the M42 and at J3A exit onto the M40 towards London/Warwick/Stratford. At J1A take the M25(S) exit to M4/M23/Heathrow Airport. Merge onto the M25. At J12 exit onto the M3 towards Southampton. At J4 take the A331 towards Camberley"
    },
    {
      heading: "From the South:",
      text: "From Southampton take the M3 north towards London. At J4 take the A331 towards Camberley. Turn right onto Stanhope Road"
    }
  ];

  let sections = JSON.parse(JSON.stringify(defaultSections));

  function renderEditor() {
    const container = document.getElementById('sectionsContainer');
    container.innerHTML = '';
    sections.forEach((section, i) => {
      const div = document.createElement('div');
      div.className = 'field-group';
      div.style.marginBottom = '12px';
      div.innerHTML = `
        <div class="field-row">
          <label class="field-label">
            Section ${i + 1} heading
            ${sections.length > 1 ? `<button class="remove-btn" onclick="removeSection(${i})" title="Remove section">✕</button>` : ''}
          </label>
          <input class="field-input" type="text" value="${escHtml(section.heading)}"
            oninput="updateSection(${i}, 'heading', this.value)" placeholder="e.g. From the North:">
        </div>
        <div class="field-row">
          <label class="field-label">Directions</label>
          <textarea class="field-textarea" oninput="updateSection(${i}, 'text', this.value)"
            placeholder="Enter directions...">${escHtml(section.text)}</textarea>
        </div>
      `;
      container.appendChild(div);
    });
    renderPreview();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function updateSection(i, key, value) {
    sections[i][key] = value;
    renderPreview();
  }

  function addSection() {
    sections.push({ heading: "From the East:", text: "" });
    renderEditor();
  }

  function removeSection(i) {
    sections.splice(i, 1);
    renderEditor();
  }

  function renderPreview() {
    const preview = document.getElementById('previewDirections');
    preview.innerHTML = sections.map((s, i) => `
      <span class="card-section-heading">${s.heading}</span>
      <p class="card-direction-text">${s.text}</p>
    `).join('');
  }

  renderEditor();
</script>
