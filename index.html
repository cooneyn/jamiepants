<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driving Instructions Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --gold: #c8a84b; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #13121a;
    color: #cdd6f4;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    background: #1e1e2e; border-bottom: 1px solid #2a2a3e;
    padding: 0 24px; height: 52px;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .topbar-title { font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
  .btn-print {
    background: var(--gold); color: #13121a; border: none; padding: 8px 20px;
    border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 13px;
    font-weight: 500; cursor: pointer; transition: opacity 0.15s;
  }
  .btn-print:hover { opacity: 0.85; }

  .main { display: flex; flex: 1; overflow: hidden; }

  .editor-panel {
    width: 320px; flex-shrink: 0; background: #1e1e2e;
    border-right: 1px solid #2a2a3e; overflow-y: auto;
    padding: 24px 20px; display: flex; flex-direction: column; gap: 16px;
  }
  .section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  .field-group { background: #13121a; border: 1px solid #2a2a3e; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .title-group { background: #13121a; border: 1px solid #2a2a3e; border-radius: 10px; padding: 14px; }
  .field-row { margin-bottom: 12px; }
  .field-row:last-child { margin-bottom: 0; }
  .field-label { display: block; font-size: 11px; color: #8888aa; margin-bottom: 5px; }
  .field-input, .field-textarea {
    width: 100%; background: #1e1e2e; border: 1px solid #2a2a3e; border-radius: 6px;
    color: #cdd6f4; font-family: 'DM Sans', sans-serif; font-size: 13px;
    padding: 8px 10px; outline: none; transition: border-color 0.15s; resize: none;
  }
  .field-input:focus, .field-textarea:focus { border-color: var(--gold); }
  .field-textarea { min-height: 100px; line-height: 1.5; }
  .add-section-btn {
    width: 100%; background: transparent; border: 1px dashed #2a2a3e; border-radius: 8px;
    color: #8888aa; font-family: 'DM Sans', sans-serif; font-size: 13px;
    padding: 10px; cursor: pointer; transition: all 0.15s;
  }
  .add-section-btn:hover { border-color: var(--gold); color: var(--gold); }
  .remove-btn { float: right; background: none; border: none; color: #555577; cursor: pointer; font-size: 15px; padding: 0 0 0 8px; transition: color 0.15s; }
  .remove-btn:hover { color: #f38ba8; }

  .preview-panel {
    flex: 1; background: #13121a; display: flex;
    align-items: flex-start; justify-content: center;
    overflow-y: auto; padding: 40px 30px;
  }

  .card {
    background: #ffffff; width: 148mm; min-height: 210mm;
    display: flex; flex-direction: column; align-items: center;
    padding: 8mm 15mm 22mm 15mm;
    box-shadow: 0 8px 48px rgba(0,0,0,0.5); flex-shrink: 0;
  }

  .header-block {
    position: relative;
    width: 100%;
    margin-bottom: 5mm;
  }

  .hearts-img {
    width: 100%;
    display: block;
    mix-blend-mode: multiply;
  }

  .title-input {
    position: absolute;
    top: 62%;
    transform: translateY(-50%);
    left: 0; right: 0;
    text-align: center;
    font-family: 'Great Vibes', cursive;
    font-size: 33pt;
    color: #2a2828;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .title-input:focus {
    background: rgba(200,168,75,0.05);
    border-radius: 4px;
  }

  .card-directions { width: 100%; text-align: center; }
  .card-section-heading {
    display: block; font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14pt; font-weight: 700; font-variant: small-caps;
    letter-spacing: 0.07em; color: #1a1a1a; margin-top: 5.5mm; margin-bottom: 1.5mm;
  }
  .card-section-heading:first-child { margin-top: 0; }
  .card-direction-text {
    font-family: 'Cormorant Garamond', Georgia, serif; font-size: 10.5pt;
    font-weight: 400; font-variant: small-caps; letter-spacing: 0.045em;
    color: #1a1a1a; line-height: 1.75;
    white-space: pre-line;
  }

  @media print {
    @page { size: A4; margin: 0; }
    body { background: white !important; height: auto !important; overflow: visible !important; }
    .topbar, .editor-panel { display: none !important; }
    .main { display: block !important; overflow: visible !important; }
    .preview-panel {
      display: block !important;
      padding: 0 !important;
      background: white !important;
      overflow: visible !important;
      width: 100% !important;
      height: auto !important;
    }
    .card {
      box-shadow: none !important;
      width: 210mm !important;
      min-height: 297mm !important;
      margin: 0 auto !important;
      padding: 12mm 20mm 25mm 20mm !important;
      font-size: 1.38 !important;
    }
    .hearts-img { width: 100% !important; }
    .title-input { font-size: 44pt !important; }
    .card-section-heading { font-size: 18pt !important; }
    .card-direction-text { font-size: 13.5pt !important; }
  }
</style>
</head>

<script>
  const defaultSections = [
    {
      heading: "What a lovely boy",
      paraLabel: "Paragraph 1",
      text: "Jamie walks with easy grace, A cheeky smile upon his face. He lights a room without a try, Like summer sun in a cloudy sky.\nHis laugh rings out, both warm and bright, Turning ordinary days to light. With kind blue eyes and a heart so true, He makes the world feel fresh and new."
    },
    {
      heading: "Sweet cheeks",
      paraLabel: "Paragraph 2",
      text: "He loves who he loves without disguise, No need for masks, no need for lies. Living boldly, proud and free, Exactly the man he's meant to be.\nAnd if you're lucky enough to know Jamie well, You'll have a hundred stories to tell. Of kindness, humour, charm and glee— A wonderful bloke, and beautifully he."
    }
  ];
  let sections = JSON.parse(JSON.stringify(defaultSections));

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function renderEditor() {
    const c = document.getElementById('sectionsContainer');
    c.innerHTML = '';
    sections.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'field-group';
      d.innerHTML = `
        <div class="field-row">
          <label class="field-label">Heading ${i+1}
            ${sections.length > 1 ? `<button class="remove-btn" onclick="removeSection(${i})">✕</button>` : ''}
          </label>
          <input class="field-input" type="text" value="${esc(s.heading)}" oninput="updateSection(${i},'heading',this.value)">
        </div>
        <div class="field-row">
          <label class="field-label">${s.paraLabel || 'Paragraph'}</label>
          <textarea class="field-textarea" oninput="updateSection(${i},'text',this.value)">${esc(s.text)}</textarea>
        </div>`;
      c.appendChild(d);
    });
    renderPreview();
  }

  function updateSection(i, k, v) { sections[i][k] = v; renderPreview(); }
  function addSection() { sections.push({ heading: "New Section", paraLabel: "Paragraph", text: "" }); renderEditor(); }
  function removeSection(i) { sections.splice(i, 1); renderEditor(); }

  function renderPreview() {
    document.getElementById('previewDirections').innerHTML =
      sections.map(s => `<span class="card-section-heading">${s.heading}</span><p class="card-direction-text">${s.text}</p>`).join('');
  }

  document.getElementById('cardTitle').addEventListener('input', function() {
    document.getElementById('titleEditorInput').value = this.value;
  });

  renderEditor();
</script>
